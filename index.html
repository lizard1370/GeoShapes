<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoShapes - Learn Geometry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">
        <h1 class="title">
            <a class="Logo-L">G</a>
            eo
            <a class="Logo-L">S</a>
            hapes</h1>
    </header>

    <div class="toolbar">
        <div class="tool-group">
            <span class="tool-label">Shapes</span>
            <button class="btn" data-shape="triangle" title="Triangle">
                <svg viewBox="0 0 24 24"><polygon points="12,4 20,20 4,20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="btn" data-shape="square" title="Square">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="btn" data-shape="circle" title="Circle">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
        </div>

        <div class="tool-group">
            <span class="tool-label">Coordinates</span>
            <input type="text" class="coord-input" id="coordInput" placeholder="x1,y1 x2,y2 x3,y3 x4,y4" title="Enter coordinates separated by spaces">
            <button class="btn" id="createBtn" title="Create from coordinates">Create</button>
        </div>

        <div class="tool-group">
            <span class="tool-label">Transform</span>
            <button class="btn" id="rotateBtn" title="Rotate 90°">
                <svg viewBox="0 0 24 24"><path d="M 12 4 A 8 8 0 0 1 20 12 L 17 12 L 20 16 L 23 12 L 20 12 A 11 11 0 1 0 12 23" fill="none" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
            </button>
            <button class="btn" id="flipBtn" title="Flip Horizontal">
                <svg viewBox="0 0 24 24"><path d="M 4 4 L 20 4 L 20 20 L 4 20 Z M 12 4 L 12 20" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 8 8 L 8 16 L 10 16 L 10 8 Z" fill="currentColor"/></svg>
            </button>
            <button class="btn" id="flipVertBtn" title="Flip Vertical">
                <svg viewBox="0 0 24 24"><path d="M 4 4 L 20 4 L 20 20 L 4 20 Z M 4 12 L 20 12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 8 14 L 16 14 L 16 16 L 8 16 Z" fill="currentColor"/></svg>
            </button>
        </div>

        <div class="tool-group">
            <span class="tool-label">Actions</span>
            <button class="btn btn-danger" id="deleteBtn" title="Delete Selected">
                <svg viewBox="0 0 24 24"><path d="M 4 4 L 20 20 M 20 4 L 4 20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="btn" id="clearBtn" title="Clear All">Clear All</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gridCanvas"></canvas>
        <canvas id="shapesCanvas"></canvas>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="info-row">
            <span class="info-label">Selected:</span>
            <span class="info-value" id="selectedInfo">None</span>
        </div>
        <div class="info-row">
            <span class="info-label">Points:</span>
            <span class="info-value" id="pointsInfo">0</span>
        </div>
        <div class="info-row" id="anglesRow" style="display: none;">
            <span class="info-label">Angles:</span>
            <span class="info-value" id="anglesInfo">-</span>
        </div>
    </div>

    <label class="toggle-label">
        <input type="checkbox" id="showAxesToggle">
        <span>Show Axes Numbers</span>
    </label>

    <div class="tooltip" id="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>
